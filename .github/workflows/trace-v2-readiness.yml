name: trace-v2-readiness

on:
  pull_request:
  push:
    branches: [main]

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          printf 'torch==2.3.1+cpu\n' > /tmp/trace-ci-constraints.txt
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -c /tmp/trace-ci-constraints.txt \
            -e ".[dev]"
      - name: Verify TRACE v2 readiness
        run: python scripts/verify_trace_v2_readiness.py

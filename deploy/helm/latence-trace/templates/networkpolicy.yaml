{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "latence-trace.fullname" . }}
  labels:
    {{- include "latence-trace.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "latence-trace.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- with .Values.networkPolicy.ingressFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.server.port }}
    {{- end }}
  egress:
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS to anywhere (model downloads + license renewal callbacks).
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # vLLM-Factory sidecar.
    - to: []
      ports:
        - protocol: TCP
          port: 8000
{{- end }}

{{- if and .Values.license.token (not .Values.license.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "latence-trace.licenseSecretName" . }}
  labels:
    {{- include "latence-trace.labels" . | nindent 4 }}
type: Opaque
stringData:
  license: {{ .Values.license.token | quote }}
{{- end }}

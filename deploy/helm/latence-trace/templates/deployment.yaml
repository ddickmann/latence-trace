apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "latence-trace.fullname" . }}
  labels:
    {{- include "latence-trace.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "latence-trace.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.server.port | quote }}
        prometheus.io/path: "/metrics"
      labels:
        {{- include "latence-trace.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "latence-trace.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "latence-trace.fullname" . }}-config
          env:
            {{- if .Values.license.token }}
            - name: LATENCE_TRACE_LICENSE_FILE
              value: /etc/latence-trace/license
            {{- else if .Values.license.existingSecret }}
            - name: LATENCE_TRACE_LICENSE_FILE
              value: /etc/latence-trace/license
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if or .Values.license.token .Values.license.existingSecret }}
            - name: license
              mountPath: /etc/latence-trace
              readOnly: true
            {{- end }}
            - name: hf-cache
              mountPath: /home/app/.cache
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if or .Values.license.token .Values.license.existingSecret }}
        - name: license
          secret:
            secretName: {{ include "latence-trace.licenseSecretName" . }}
            items:
              - key: {{ default "license" .Values.license.existingSecretKey }}
                path: license
            defaultMode: 0400
        {{- end }}
        - name: hf-cache
          {{- if eq .Values.hfCacheVolume.type "persistentVolumeClaim" }}
          persistentVolumeClaim:
            claimName: {{ include "latence-trace.fullname" . }}-hf-cache
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.hfCacheVolume.size }}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if and (eq .Values.hfCacheVolume.type "persistentVolumeClaim") (gt (len .Values.hfCacheVolume.storageClass) 0) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "latence-trace.fullname" . }}-hf-cache
  labels:
    {{- include "latence-trace.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.hfCacheVolume.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.hfCacheVolume.size }}
{{- end }}

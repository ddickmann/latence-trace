[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latence-trace"
version = "0.1.0"
description = "Groundedness Tracker (Beta) - calibrated, auditable hallucination detection for RAG and evidence-bearing LLM outputs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "latence.ai" }]
keywords = [
  "groundedness",
  "hallucination-detection",
  "rag",
  "nli",
  "semantic-entropy",
  "colbert",
  "maxsim",
]

dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "triton>=2.3; platform_system != 'Darwin'",
  "transformers>=4.41",
  "sentence-transformers>=3.0",
  "spacy>=3.7",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pylate>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
latence-trace-server = "server.main:run"
latence-trace-calibrate = "scripts.calibrate_thresholds:main"
latence-trace-sweep = "scripts.sweep_fusion_weights:main"

[tool.setuptools]
packages = ["latence_trace", "latence_trace.api", "latence_trace.core", "latence_trace.kernels", "latence_trace.providers"]
include-package-data = true

[tool.setuptools.package-data]
"latence_trace.core" = ["thresholds.json"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latence-trace"
version = "0.1.0"
description = "Latence TRACE - enterprise AI compliance runtime for PII redaction and groundedness verification."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "latence.ai" }]
keywords = [
  "groundedness",
  "hallucination-detection",
  "rag",
  "nli",
  "semantic-entropy",
  "colbert",
  "maxsim",
]

dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "triton>=2.3; platform_system != 'Darwin'",
  "transformers>=4.41",
  "sentence-transformers>=3.0",
  "spacy>=3.7",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pylate>=1.1",
  "PyJWT[crypto]>=2.8",
  "cryptography>=42.0",
  "prometheus-client>=0.19",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  # Tree-sitter grammars power the code-lane AST drift / phantom-symbol
  # signals. These are FIRST-CLASS runtime deps: without them the code
  # lane silently falls back to a regex extractor that does not catch
  # invented imports / classes / function calls, which is a direct
  # quality regression in production. The Dockerfile has a build-time
  # smoke test that refuses to ship an image missing any of these.
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-go>=0.23",
  "tree-sitter-rust>=0.23",
  # Language detection drives per-request bundle / NLI defaults
  # (de vs en). Pure-Python n-gram, ~3 ms per 200-char probe, no
  # model download. Used by latence_trace.core.language_detector.
  "langdetect>=1.0.9",
  # Sentence segmentation. WTPSplit (SaT) is a small transformer
  # tokeniser-free segmenter that handles 85 languages with
  # state-of-the-art accuracy on adversarial inputs (e.g. German
  # ``z. B.``, ``d. h.``, English ``e. g.``, decimal numbers, mixed
  # punctuation). PySBD is the deterministic, dependency-free fallback
  # used when the SaT singleton is not yet warm or fails (we never
  # silently degrade to a regex). Both are loaded lazily at first use
  # and pre-warmed at RunPod boot.
  "wtpsplit>=2.1",
  "pysbd>=0.3.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
]
otel = [
  "opentelemetry-exporter-otlp>=1.24",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "opentelemetry-instrumentation-httpx>=0.45b0",
]

[project.scripts]
latence-trace = "latence_trace.cli:main"
latence-trace-server = "server.main:run"
latence-trace-calibrate = "scripts.calibrate_thresholds:main"
latence-trace-calibrate-rag-prose = "scripts.calibrate_rag_prose:main"
latence-trace-sweep = "scripts.sweep_fusion_weights:main"

[tool.setuptools]
packages = [
  "latence_trace",
  "latence_trace.api",
  "latence_trace.auth",
  "latence_trace.cli",
  "latence_trace.compliance",
  "latence_trace.core",
  "latence_trace.core.code_lane",
  "latence_trace.data",
  "latence_trace.kernels",
  "latence_trace.memory",
  "latence_trace.mcp",
  "latence_trace.middleware",
  "latence_trace.observability",
  "latence_trace.providers",
]
include-package-data = true

[tool.setuptools.package-data]
"latence_trace.core" = ["thresholds.json"]
# ``composite_logistic_v3.json`` is fit offline via
# ``research/triangular_maxsim/coding/experiments/v3_ablation.py`` and
# dropped next to ``composite.py`` for packaging. The file is optional:
# when absent the code lane falls back to :class:`LinearComposite` (see
# docs/code_lane_v3.md). The glob below keeps the artefact in the wheel
# whenever it is present without making the build fail when it is not.
"latence_trace.core.code_lane" = ["composite_logistic_v3.json"]
"latence_trace.data" = ["*.json", "heads/*.json", "heads/*.md"]
"latence_trace.auth" = ["license_pubkey.pem"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning:pydantic.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "research/**",
  "plugin_client/**",
]

[tool.ruff.lint]
# Base rules on the whole repo; stricter rules pinned to the new code lane.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "ARG"]
ignore = [
  "E501",  # line length handled by formatter
  "B008",  # FastAPI Depends() default-arg pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "B"]

# --- mypy: strict only on the new code-lane surface ---
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
# Repo-wide we stay lenient to avoid churn on legacy modules.
ignore_missing_imports = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "latence_trace.core.code_lane.*",
  "latence_trace.api.models",
]
# Strict typing for the new code-lane modules and the public schema.
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
check_untyped_defs = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latence-trace"
version = "0.1.0"
description = "Groundedness Tracker - calibrated, auditable hallucination detection for RAG and evidence-bearing LLM outputs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "latence.ai" }]
keywords = [
  "groundedness",
  "hallucination-detection",
  "rag",
  "nli",
  "semantic-entropy",
  "colbert",
  "maxsim",
]

dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "triton>=2.3; platform_system != 'Darwin'",
  "transformers>=4.41",
  "sentence-transformers>=3.0",
  "spacy>=3.7",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pylate>=1.1",
  "PyJWT[crypto]>=2.8",
  "cryptography>=42.0",
  "prometheus-client>=0.19",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
]
otel = [
  "opentelemetry-exporter-otlp>=1.24",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "opentelemetry-instrumentation-httpx>=0.45b0",
]

[project.scripts]
latence-trace = "latence_trace.cli:main"
latence-trace-server = "server.main:run"
latence-trace-calibrate = "scripts.calibrate_thresholds:main"
latence-trace-sweep = "scripts.sweep_fusion_weights:main"

[tool.setuptools]
packages = [
  "latence_trace",
  "latence_trace.api",
  "latence_trace.auth",
  "latence_trace.cli",
  "latence_trace.core",
  "latence_trace.kernels",
  "latence_trace.mcp",
  "latence_trace.middleware",
  "latence_trace.observability",
  "latence_trace.providers",
]
include-package-data = true

[tool.setuptools.package-data]
"latence_trace.core" = ["thresholds.json"]
"latence_trace.auth" = ["license_pubkey.pem"]

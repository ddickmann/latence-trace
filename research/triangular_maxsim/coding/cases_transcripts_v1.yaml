  - id: base_08_cleanup_audit_entry
    transcript_id: 0b1422bb
    response_turn: 839
    fence_idx: 0
    description: >-
      JSON audit-log fragment describing a vLLM connection cleanup. Wrong
      variant rewrites both the field names and the env-var name. Ambiguous
      variant nudges a single action-enum tag.
    variants:
      - tier: wrong
        id: base_08_cleanup_audit_entry_wrong
        notes: >-
          Rename top-level key, action, and per-field keys; drift the env-var
          name to one that never appears in context.
        response: |
          ### Result (fresh, clean run)

          Audit log entry for the delete:

          ```json
          "teardown": {
              "action": "terminated_graceful",
              "message": "stopped 1 listener(s) on 127.0.0.1:8000 via SIGTERM",
              "host": "127.0.0.1",
              "port": 8000,
              "process_ids": [316521]
          }
          ```

          `terminated_graceful` means SIGTERM was enough; the SIGKILL escalation path is there as a 10-second safety net (configurable via `LATENCE_CONNECTION_SHUTDOWN_TIMEOUT_MS`).

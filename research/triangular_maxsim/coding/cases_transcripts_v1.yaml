schema: transcripts_v1
version: 1

context:
  max_files: 40
  context_token_cap_chars: 160000
  scope_before_chars: 500
  scope_after_chars: 250

# Each scenario defines a base point: (transcript_id, response_turn, fence_idx).
# The loader auto-extracts the "correct" variant: prose around the fence + fence
# unchanged. Wrong + ambiguous variants embed the full response text so the edits
# are explicit and reviewable.


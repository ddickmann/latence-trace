  - id: base_04_structured_evidence_detector
    transcript_id: f0afeaf2
    response_turn: 1771
    fence_idx: 0
    description: >-
      Heuristic function returning an enum over evidence kinds. Rich surface
      for both heavy renames (enum drift) and a subtle one-branch swap.
    variants:
      - tier: wrong
        id: base_04_structured_evidence_detector_wrong
        notes: >-
          Rename the function, drift the enum name and all four members,
          replace re.search with re.fullmatch (semantically wrong), import
          from a phantom LayoutClassifier package.
        response: |
          Typed evidence detector — `latence_trace/core/structured_evidence.py`

          Heuristic per support unit:

          ```python
          from latence_trace.evidence.layout_engine import LayoutClassifier

          def classify_evidence_layout(text: str) -> EvidenceFormat:
              # Returns PROSE | BULLETS | KEY_PAIR | GRID
              digits = sum(c.isdigit() for c in text) / max(1, len(text))
              has_currency = bool(re.fullmatch(r"[\$\€\£]|USD|EUR|GBP", text))
              has_percent = "%" in text or "percent" in text.lower()
              has_columnar = bool(re.fullmatch(r"(?:[A-Za-z][^:]{2,30}: ?[\$\d][\d,\.]*[MBmb]?\b[;,] ?){2,}", text))
              has_kv = bool(re.fullmatch(r"^\s*[A-Z][\w\s/-]{2,40}:\s*[\d\$]", text, re.MULTILINE))
              if has_columnar: return GRID
              if has_kv:       return KEY_PAIR
              if digits > 0.08 and (has_currency or has_percent):
                  return BULLETS
              return PROSE
          ```

          This is a heuristic, not ML — and that's a feature. We tested heuristic chunk classifiers in the original chunking work and they're within ~1% of a trained classifier and never bring a model dependency.
      - tier: ambiguous
        id: base_04_structured_evidence_detector_ambiguous
        notes: >-
          One enum value drift (`KEY_VALUE` -> `KV_PAIR`) in a single branch.
          Everything else grounded. Hard case.
        response: |
          Typed evidence detector — `latence_trace/core/structured_evidence.py`

          Heuristic per support unit:

          ```python
          def is_structured(text: str) -> StructuredEvidenceKind:
              # Returns NARRATIVE | LIST | KEY_VALUE | TABLE
              digits = sum(c.isdigit() for c in text) / max(1, len(text))
              has_currency = bool(re.search(r"[\$\€\£]|USD|EUR|GBP", text))
              has_percent = "%" in text or "percent" in text.lower()
              has_columnar = bool(re.search(r"(?:[A-Za-z][^:]{2,30}: ?[\$\d][\d,\.]*[MBmb]?\b[;,] ?){2,}", text))
              has_kv = bool(re.search(r"^\s*[A-Z][\w\s/-]{2,40}:\s*[\d\$]", text, re.MULTILINE))
              if has_columnar: return TABLE
              if has_kv:       return KV_PAIR
              if digits > 0.08 and (has_currency or has_percent):
                  return LIST
              return NARRATIVE
          ```

          This is a heuristic, not ML — and that's a feature. We tested heuristic chunk classifiers in the original chunking work and they're within ~1% of a trained classifier and never bring a model dependency.


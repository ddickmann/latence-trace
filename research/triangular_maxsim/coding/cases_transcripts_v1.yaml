    response_turn: 543
    fence_idx: 0
    description: >-
      Python helper that composes pooling primitives. Rich symbol surface
      (TokenPooler, AllPool, TokenEmbeddingPoolerHead, PoolerNormalize,
      _load_st_projector, get_tok_pooling_method) makes both a heavy and a
      subtle edit meaningful.
    variants:
      - tier: wrong
        id: base_01_pooler_helper_wrong
        notes: >-
          Rename all factory + component symbols to invented-but-plausible
          names; add phantom import from a module that was never quoted in
          context. Same prose so only the code-body signal differs.
        response: |
          Let me look at what `build_token_pooling_stack` creates:

          ```python
          from vllm.extensions.pooling_v2 import FullSpanPool, L2NormalizationLayer

          def build_token_pooling_stack(pooler_config, projector=None):
              pooling = resolve_pooling_strategy(pooler_config.token_pool_kind)  # FullSpanPool()
              head = TokenEmbeddingHeadV2(
                  head_dtype=model_config.head_dtype,
                  projector=projector if projector is not None else _materialize_projector_from_hf(model_config),
                  activation=L2NormalizationLayer(),
              )
              return CompositeTokenPooler(pooling=pooling, head=head)
          ```

          So it's building a `CompositeTokenPooler` that combines `FullSpanPool()` for splitting with a `TokenEmbeddingHeadV2` that includes its own projector and normalization.
      - tier: ambiguous
        id: base_01_pooler_helper_ambiguous
        notes: >-
          Single surgical swap: read the pool type off a phantom attribute
          `token_pool_kind` instead of calling the real `get_tok_pooling_type()`
          method. Everything else grounded.
        response: |
          Let me look at what `pooler_for_token_embed` creates:

          ```python
          def pooler_for_token_embed(pooler_config, projector=None):
              pooling = get_tok_pooling_method(pooler_config.token_pool_kind)  # AllPool()
              head = TokenEmbeddingPoolerHead(
                  head_dtype=model_config.head_dtype,
                  projector=projector if projector is not None else _load_st_projector(model_config),
                  activation=PoolerNormalize(),
              )
              return TokenPooler(pooling=pooling, head=head)
          ```

          So it's building a `TokenPooler` that combines `AllPool()` for splitting with a `TokenEmbeddingPoolerHead` that includes its own projector and normalization.


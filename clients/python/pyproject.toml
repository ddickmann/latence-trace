[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latence-trace-client"
version = "1.0.0"
description = "Official Python SDK for the latence-trace Groundedness Tracker."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "latence.ai", email = "support@latence.ai" }]
keywords = [
  "groundedness",
  "hallucination-detection",
  "rag",
  "llm",
  "latence-trace",
]

dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.24",
  "opentelemetry-instrumentation-httpx>=0.45b0",
]
langchain = ["langchain-core>=0.2"]
llama_index = ["llama-index-core>=0.10"]
openai = ["openai>=1.30"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.20",
]

[tool.setuptools]
packages = [
  "latence_trace_client",
  "latence_trace_client.integrations",
]
